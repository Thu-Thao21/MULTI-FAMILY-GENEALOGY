version: '3.8'

services:
  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
    container_name: mfg_frontend
    ports:
      - "8080:80" # Truy cập ở http://localhost:8080
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - mfg_network

  # Mẫu cho Backend sau này (nếu có)

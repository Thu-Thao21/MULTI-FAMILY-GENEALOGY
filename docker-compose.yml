  #   environment:
  #     POSTGRES_USER: root
  #     POSTGRES_PASSWORD: rootpassword
  #     POSTGRES_DB: mfg_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - pgdata:/var/lib/postgresql/data
  #   networks:
  #     - mfg_network

networks:
  mfg_network:
    driver: bridge

volumes:
  pgdata:

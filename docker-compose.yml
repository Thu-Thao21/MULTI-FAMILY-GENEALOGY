version: '3.8'

services:
  frontend:
    build:
      context: ./FE
      dockerfile: Dockerfile
      args:
        # URL tuyệt đối của BE mới, được nhúng vào bản build Vite
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8001/api/v1}
    container_name: mfg_frontend
    ports:
      - "8080:80" # Truy cập ở http://localhost:8080
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    networks:
      - mfg_network

# Backend (MFGMS-AI) nằm ở repo riêng; FE gọi BE bằng URL tuyệt đối VITE_API_BASE_URL.

networks:
  mfg_network:
    driver: bridge
